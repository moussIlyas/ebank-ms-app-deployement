# ebank-service - DEV
server.port=8057
spring.cloud.discovery.enabled=true
# Database (MariaDB via docker-compose, see docker-compose.yml)
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:3306/accounts-db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
