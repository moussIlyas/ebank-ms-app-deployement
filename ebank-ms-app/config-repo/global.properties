# ============================================================
# Global defaults for ALL services (loaded first)
# Service-specific files (e.g. ebank-bot-dev.properties) override these.
# ============================================================
spring.cloud.config.enabled=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Health for container healthchecks + graceful shutdown so `docker stop`
# (stop_grace_period: 30s in docker-compose.yml) finishes in-flight requests
management.endpoints.web.exposure.include=health,info
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s
