# ebank-bot - PRODUCTION
# In real production, inject secrets via environment variables instead of hardcoding:
#   export OLLAMA_API_KEY=...
#   export TAVILY_API_KEY=...

server.port=8058
spring.cloud.discovery.enabled=true

app.agent.provider=ollama

app.agent.system-prompt=You are the e-banking assistant of Ebank. \
Answer clearly and concisely in the language of the user. \
Use the webSearch tool whenever the user asks about current information, \
news, exchange rates, or anything that may require up-to-date data. \
Never invent banking data or search results.

spring.ai.ollama.base-url=https://ollama.com
spring.ai.ollama.api-key=${OLLAMA_API_KEY}
spring.ai.ollama.chat.options.model=gpt-oss:20b

app.tavily.base-url=https://api.tavily.com
app.tavily.api-key=${TAVILY_API_KEY}
app.tavily.max-results=5
